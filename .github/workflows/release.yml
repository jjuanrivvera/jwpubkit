name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    uses: jjuanrivvera/.github/.github/workflows/go-release.yml@main
    with:
      # git-flow: tags come off develop, and this leaves main pointing at what was
      # released instead of trailing behind.
      promote-main: true
    secrets: inherit
