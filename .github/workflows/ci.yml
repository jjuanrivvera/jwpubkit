name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  # A release fast-forwards main using GITHUB_TOKEN, and a push made with that
  # token does not trigger workflows — so main never re-ran CI and its badge sat
  # on the very first, failing run while develop went green nine times. This runs
  # CI on the default branch once the release is done, which is what the badge
  # reports.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  ci:
    uses: jjuanrivvera/.github/.github/workflows/go-ci.yml@main
    with:
      # Measured, not aspirational: the total sits around 50% (internal/cli near 21%,
      # cdn uncovered) and drifts a point between runners, so the gate sits under it.
      # It is a ratchet: raise it as the command layer gets covered.
      coverage-threshold: "60"
      run-gosec: true
      # There is no tools/gendocs yet, so no generated documentation can drift.
      run-docs-check: false
