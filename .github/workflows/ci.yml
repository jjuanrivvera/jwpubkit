name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: jjuanrivvera/.github/.github/workflows/go-ci.yml@main
    with:
      # Medido, no aspiracional: el total ronda el 50% (internal/cli va por 21% y
      # cdn sin cubrir) y baila un punto entre runners, así que la puerta va debajo.
      # Es un trinquete: súbelo al cubrir la capa de comandos.
      coverage-threshold: "45"
      run-gosec: true
      # No hay tools/gendocs todavía, así que no hay documentación generada que
      # pueda desincronizarse.
      run-docs-check: false
