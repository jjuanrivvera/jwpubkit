version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - unconvert
    - nilerr
  settings:
    misspell:
      locale: US
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Fixtures carry publication-shaped text in other languages; an english
      # dictionary has nothing useful to say about it.
      - path: _test\.go
        linters: [misspell, errcheck]
      - path: '.*\.go'
        linters: [errcheck]
        text: '(Write|Print|Close|Remove|Mkdir|Sync|WriteString)'
      - path: internal/store/index\.go
        linters: [staticcheck]
        text: 'error strings should not be capitalized'
      - path: internal/content/content\.go
        linters: [unused]
        text: 'field figDone is unused'
      - path: internal/store/index\.go
        linters: [errcheck]
        text: '(Rollback|Sscan)'
      - path: internal/store/query\.go
        linters: [errcheck]
        text: '\.Scan'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jjuanrivvera/jwpubkit
