version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # misspell queda fuera a propósito: este código se documenta en español y el
    # diccionario es de inglés, así que marca palabras correctas ("comando" por
    # "commando"). La alternativa era una lista de excepciones que solo crece.
    - revive
    - bodyclose
    - unconvert
    - nilerr
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      - path: '.*\.go'
        linters: [errcheck]
        text: '(Write|Print|Close|Remove|Mkdir|Sync|WriteString)'
      - path: internal/store/index\.go
        linters: [staticcheck]
        text: 'error strings should not be capitalized'
      - path: internal/content/content\.go
        linters: [unused]
        text: 'field figDone is unused'
      - path: internal/store/index\.go
        linters: [errcheck]
        text: '(Rollback|Sscan)'
      - path: internal/store/query\.go
        linters: [errcheck]
        text: '\.Scan'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jjuanrivvera/jwpubkit
