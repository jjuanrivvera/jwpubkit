version: 2

builds:
  - id: pubkit
    main: .
    binary: pubkit
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/jjuanrivvera/jwpubkit/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, README-es.md, LICENSE]

checksum:
  name_template: checksums.txt

release:
  github: { owner: jjuanrivvera, name: jwpubkit }
  prerelease: auto
